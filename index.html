<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANZz STORE</title>
    <style>
        /* Base & Fonts */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { 
            background-color: #000000; 
            color: #fff; 
            overflow-x: hidden; 
            min-height: 100vh;
            position: relative;
        }

        /* CANVAS UNTUK ANIMASI BINTANG JATUH */
        #starfield {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        /* INSTANT WELCOME (Splash Screen) */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 1s ease, visibility 1s;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }
        
        .welcome-text {
            font-size: 2.2rem; color: #00ffcc; text-transform: uppercase;
            letter-spacing: 5px; text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 40px #00ffcc;
            white-space: nowrap; overflow: hidden;
            border-right: 4px solid #00ffcc;
            animation: typing 2s steps(20, end), blink 0.75s step-end infinite;
        }
        .welcome-sub { 
            margin-top: 15px; font-size: 0.9rem; color: #a855f7; 
            letter-spacing: 3px; opacity: 0; animation: fadeIn 2s 2s forwards; 
            text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7;
        }
        
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: #00ffcc } }
        @keyframes fadeIn { to { opacity: 1 } }

        /* MAIN CONTENT */
        #main-content { display: none; min-height: 100vh; position: relative; z-index: 1; padding-bottom: 50px;}
        #main-content.show { display: block; animation: fadeIn 1.5s ease; }

        /* Header */
        header { 
            padding: 20px; border-bottom: 1px solid rgba(0, 255, 204, 0.2); 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .brand { font-size: 1.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px #fff; }
        .brand span { color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
        .status { 
            font-size: 0.8rem; color: #00ffcc; display: flex; align-items: center; gap: 8px; 
            text-shadow: 0 0 10px #00ffcc; font-weight: bold;
        }
        .status::before { 
            content: ''; width: 10px; height: 10px; background: #00ffcc; 
            border-radius: 50%; box-shadow: 0 0 15px #00ffcc; animation: blink 1s infinite; 
        }

        /* Hero Banner */
        .hero { 
            padding: 80px 20px; text-align: center; 
            border-bottom: 1px solid rgba(0, 255, 204, 0.1);
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 15px; letter-spacing: 2px; }
        .hero h1 span { color: #00ffcc; text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; }
        .hero p { color: #cbd5e1; font-size: 1rem; max-width: 450px; margin: 0 auto; line-height: 1.8; text-shadow: 1px 1px 3px #000;}

        /* File List Section */
        .section-title { 
            padding: 15px 20px; font-size: 1.1rem; margin: 40px 20px 20px 20px; 
            border-left: 4px solid #a855f7; background: rgba(20, 20, 30, 0.6);
            box-shadow: -5px 0 20px -5px #a855f7; color: #fff; text-shadow: 0 0 10px #a855f7;
            border-radius: 0 10px 10px 0; backdrop-filter: blur(10px);
            border-top: 1px solid rgba(168, 85, 247, 0.2);
            border-right: 1px solid rgba(168, 85, 247, 0.2);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
        }
        
        .file-grid { padding: 0 20px 40px 20px; display: grid; grid-template-columns: 1fr; gap: 20px; }

        /* Card File (Glassmorphism) */
        .file-card {
            background: rgba(15, 20, 30, 0.6); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px;
            padding: 25px; display: flex; flex-direction: column; gap: 15px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative; overflow: hidden;
        }
        .file-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #00ffcc, transparent);
            opacity: 0; transition: 0.4s;
        }
        .file-card:hover { 
            border-color: rgba(0, 255, 204, 0.5); transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 255, 204, 0.1); 
        }
        .file-card:hover::before { opacity: 1; }
        
        .file-header { display: flex; justify-content: space-between; align-items: center; }
        .file-name { font-size: 1.2rem; font-weight: bold; color: #fff; text-shadow: 0 0 8px #fff; }
        .file-tag { font-size: 0.75rem; background: rgba(168, 85, 247, 0.2); color: #e9d5ff; padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(168, 85, 247, 0.5); }
        .file-desc { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; }
        .file-meta { display: flex; gap: 20px; font-size: 0.8rem; color: #64748b; margin-top: 5px; }
        
        /* Tombol Download */
        .btn-dl {
            display: block; text-align: center; text-decoration: none;
            background: transparent; color: #00ffcc; font-weight: 900;
            padding: 15px; border-radius: 10px; font-size: 1rem; margin-top: 10px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 3px;
            border: 2px solid #00ffcc; position: relative; overflow: hidden; z-index: 1;
        }
        .btn-dl::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: #00ffcc; transition: 0.3s; z-index: -1;
        }
        .btn-dl:hover { color: #000; box-shadow: 0 0 20px #00ffcc; }
        .btn-dl:hover::before { left: 0; }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 60px 20px; color: #94a3b8;
            border: 2px dashed rgba(100, 116, 139, 0.3); border-radius: 15px; margin: 0 20px 40px 20px;
            background: rgba(15, 20, 30, 0.4); backdrop-filter: blur(10px);
        }
        .empty-state h2 { color: #fff; margin-bottom: 15px; text-shadow: 0 0 15px #64748b; letter-spacing: 2px;}
    </style>
</head>
<body>

    <!-- Canvas buat Animasi Bintang Jatuh -->
    <canvas id="starfield"></canvas>

    <!-- 1. INSTANT WELCOME SCREEN -->
    <div id="welcome-screen">
        <div class="welcome-text">HANZz STORE</div>
        <div class="welcome-sub">Initializing Cyberpunk Protocol...</div>
    </div>

    <!-- 2. MAIN CONTENT -->
    <div id="main-content">
        <header>
            <div class="brand">HANZz<span>_STORE</span></div>
            <div class="status">SYSTEM ONLINE</div>
        </header>

        <section class="hero">
            <h1>Welcome To <span>HANZz STORE</span></h1>
            <p>Pusat file, mod, dan tools terbaik. Update setiap hari, 100% gratis. Pilih file yang mau lo download di bawah.</p>
        </section>

        <div class="section-title">📁 FILE TERSEDIA</div>

        <!-- ======================================================== -->
        <!-- AREA FILE (NANTI ISI DI SINI) -->
        <!-- ======================================================== -->

        <div class="empty-state">
            <h2>[ BELUM ADA FILE ]</h2>
            <p>Database sedang diupdate. Cek lagi nanti ya!</p>
        </div>

        <!-- 
        CARA NAMBAH FILE BARU:
        1. Hapus tag <div class="empty-state">...</div> di atas.
        2. Copy kode <div class="file-grid">...</div> di bawah ini, hapus tanda komentar HTML-nya.
        -->

        <!--
        <div class="file-grid">
            <div class="file-card">
                <div class="file-header">
                    <div class="file-name">NAMA FILE LO</div>
                    <div class="file-tag">KATEGORI</div>
                </div>
                <div class="file-desc">Penjelasan singkat tentang file ini.</div>
                <div class="file-meta">
                    <span>📦 Size: 10MB</span>
                    <span>📅 Update: Hari ini</span>
                </div>
                <a href="LINK_BICOLINK_LO" class="btn-dl">Download File</a>
            </div>
        </div>
        -->
        
    </div>

    <!-- 3. JAVASCRIPT -->
    <script>
        // --- SCRIPT WELCOME SCREEN ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('main-content').classList.add('show');
            }, 3500); 
        });

        // --- SCRIPT ANIMASI BINTANG JATUH (STARFIELD) ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random() * width;
                this.size = Math.random() * 1.5;
                this.speed = Math.random() * 2 + 0.5;
            }
            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.y = 0;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffcc'; // Warna bintang (cyan)
                ctx.fill();
            }
        }

        // Bikin 150 bintang
        for (let i = 0; i < 150; i++) {
            stars.push(new Star());
        }

        function animate() {
            // Efek trail (ekor) bintang
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
